name: locus-wiki

services:
  wiki:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7331:8000"
    volumes:
      - type: bind
        source: .
        target: /workspace
    environment:
      WIKI_WORKSPACE: /workspace
      WIKI_DATABASE: /workspace/wiki.sqlite3
      WIKI_MODEL: ${WIKI_MODEL:-gpt-5.5}
      WIKI_SCAN_INTERVAL: ${WIKI_SCAN_INTERVAL:-3}
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
