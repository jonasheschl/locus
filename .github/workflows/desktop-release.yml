name: Desktop release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        run: node scripts/desktop-release.mjs prepare "$GITHUB_REF_NAME"

      - name: Download Neutralino runtime
        run: npm run desktop:update

      - name: Build desktop package
        run: npm run desktop:build

      - name: Create update manifest
        run: node scripts/desktop-release.mjs manifest "$GITHUB_REF_NAME"

      - name: Publish webview-compatible update channel
        working-directory: ${{ github.workspace }}
        run: |
          channel_root="$(mktemp -d)"
          channel_dir="$channel_root/channel"
          git worktree add --detach "$channel_dir"
          git -C "$channel_dir" switch --orphan desktop-updates
          mkdir -p "$channel_dir/$GITHUB_REF_NAME"
          cp frontend/desktop-dist/update.json "$channel_dir/update.json"
          cp frontend/desktop-dist/locus/resources.neu "$channel_dir/$GITHUB_REF_NAME/resources.neu"
          git -C "$channel_dir" add update.json "$GITHUB_REF_NAME/resources.neu"
          git -C "$channel_dir" config user.name github-actions[bot]
          git -C "$channel_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$channel_dir" commit -m "Publish desktop update $GITHUB_REF_NAME"
          git -C "$channel_dir" push --force origin HEAD:desktop-updates

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          desktop-dist/locus-release.zip
          desktop-dist/locus/resources.neu#resources.neu
          desktop-dist/update.json#update.json
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
